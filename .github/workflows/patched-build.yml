name: patched-build
on:
  push:
    branches: [patch-7899]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm run build
        working-directory: frontend

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false

      - name: Run patch regression tests
        run: |
          cd backend
          go test ./internal/handler/ -run 'Failover|SameAccount' -count=1
          go test ./internal/service/ -run 'Antigravity' -count=1

      - name: Build backend with embedded frontend
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags embed \
            -ldflags="-s -w -X main.Version=0.2.15+pr7899 -X main.Commit=${GITHUB_SHA::9} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildType=release" \
            -trimpath \
            -o ../sub2api-patched \
            ./cmd/server
          cd ..
          sha256sum sub2api-patched > sub2api-patched.sha256
          ls -la sub2api-patched

      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-patched-linux-amd64
          path: |
            sub2api-patched
            sub2api-patched.sha256
          retention-days: 7
